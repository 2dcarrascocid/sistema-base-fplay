# Base Fairplay API — Serverless Framework v4, stages dev and prod.
# Prerequisites per stage (see README.md): Secrets Manager secrets, SES identity, IdP credentials.
service: base-fairplay-api
package:
  patterns:
    - '!iot/**'
    - '!**/*.pem.key'
    - '!**/*certificate.pem.crt'
    - '!.env*'
frameworkVersion: '4'

params:
  default:
    region: us-east-1
    googleEnabled: 'false'
    facebookEnabled: 'false'
    appleEnabled: 'false'
    # Must list the same providers as the *Enabled flags (shown on the login page).
    federatedProviders: ''
    logRetentionDays: 90
    deletionProtection: INACTIVE
  prod:
    deletionProtection: ACTIVE
    logRetentionDays: 365
  # Every other parameter is set per stage in the Serverless Dashboard or with --param="name=value":
  #   webDomain (e.g. app.example.cl), certificateArn (ACM, us-east-1, for webDomain),
  #   cognitoDomainPrefix, mobileRedirectUri, emailFrom, sesIdentityArn, turnstileHostname,
  #   dbHost, dbPort, dbName, apiDbSecretArn, authDbSecretArn, appSecretArn, originSecretArn, idpSecretName.
  # The stack must be deployed in us-east-1: the CloudFront WAF and certificate live there.

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: ${param:region}
  memorySize: 512
  timeout: 10
  logRetentionInDays: ${param:logRetentionDays}
  endpointType: REGIONAL
  apiGateway:
    minimumCompressionSize: 1024
  environment:
    STAGE: ${sls:stage}
    NODE_OPTIONS: --enable-source-maps
    COGNITO_USER_POOL_ID: !Ref UserPool
    COGNITO_WEB_CLIENT_ID: !Ref WebClient
    COGNITO_MOBILE_CLIENT_ID: !Ref MobileClient
    COGNITO_DOMAIN: https://${param:cognitoDomainPrefix}.auth.${aws:region}.amazoncognito.com
    WEB_URL: https://${param:webDomain}
    DB_HOST: ${param:dbHost}
    DB_PORT: ${param:dbPort}
    DB_NAME: ${param:dbName}
    DB_SSL: require
    EMAIL_FROM: ${param:emailFrom}
    PHOTO_BUCKET: !Ref PhotoBucket
    TURNSTILE_HOSTNAME: ${param:turnstileHostname}
    FEDERATED_PROVIDERS: ${param:federatedProviders}

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap:
      type: linked
    # Bundle the pinned AWS SDK instead of using the runtime's copy.
    exclude: []

functions:
  auth:
    handler: src/auth/index.handler
    role: AuthFunctionRole
    environment:
      DB_SECRET_ARN: ${param:authDbSecretArn}
      APP_SECRET_ARN: ${param:appSecretArn}
      ORIGIN_SECRET_ARN: ${param:originSecretArn}
      NEEDS_WEB_CLIENT_SECRET: 'true'
    events:
      - http: { path: /auth/config, method: get }
      - http: { path: /auth/login, method: post }
      - http: { path: /auth/challenge, method: post }
      - http: { path: /auth/mfa/setup, method: post }
      - http: { path: /auth/refresh, method: post }
      - http: { path: /auth/logout, method: post }
      - http: { path: '/auth/federated/{provider}/start', method: get }
      - http: { path: /auth/federated/callback, method: get }
      - http: { path: /auth/password/forgot, method: post }
      - http: { path: /auth/password/reset, method: post }
      - http: { path: /auth/invitations/accept, method: post }
      - http: { path: /auth/register, method: post }

  me:
    handler: src/me/index.handler
    role: MeFunctionRole
    environment:
      DB_SECRET_ARN: ${param:apiDbSecretArn}
      ORIGIN_SECRET_ARN: ${param:originSecretArn}
    events:
      - http: { path: /me, method: get }
      - http: { path: /me, method: patch }
      - http: { path: /me/password, method: post }
      - http: { path: /me/sessions, method: get }
      - http: { path: '/me/sessions/{id}', method: delete }
      - http: { path: /me/sessions/revoke-others, method: post }
      - http: { path: /me/mfa/setup, method: post }
      - http: { path: /me/mfa/verify, method: post }
      - http: { path: /me/mfa, method: delete }
      - http: { path: /me/photo/upload-url, method: post }
      - http: { path: /me/photo, method: put }

  admin:
    handler: src/admin/index.handler
    role: AdminFunctionRole
    environment:
      DB_SECRET_ARN: ${param:apiDbSecretArn}
      ORIGIN_SECRET_ARN: ${param:originSecretArn}
    events:
      - http: { path: /admin/roles, method: get }
      - http: { path: /admin/users, method: get }
      - http: { path: /admin/users, method: post }
      - http: { path: /admin/users/export, method: get }
      - http: { path: '/admin/users/{id}', method: get }
      - http: { path: '/admin/users/{id}', method: patch }
      - http: { path: '/admin/users/{id}/permissions', method: get }
      - http: { path: '/admin/users/{id}/profiles', method: put }
      - http: { path: '/admin/users/{id}/activate', method: post }
      - http: { path: '/admin/users/{id}/deactivate', method: post }
      - http: { path: '/admin/users/{id}/unlock', method: post }
      - http: { path: '/admin/users/{id}/reset-password', method: post }
      - http: { path: '/admin/users/{id}/revoke-sessions', method: post }
      - http: { path: '/admin/users/{id}/invitation', method: post }
      - http: { path: /admin/permission-catalog, method: get }
      - http: { path: /admin/profiles, method: get }
      - http: { path: /admin/profiles, method: post }
      - http: { path: '/admin/profiles/{id}', method: get }
      - http: { path: '/admin/profiles/{id}', method: patch }
      - http: { path: '/admin/profiles/{id}/users', method: get }
      - http: { path: '/admin/profiles/{id}/permissions', method: put }
      - http: { path: '/admin/profiles/{id}/duplicate', method: post }
      - http: { path: '/admin/profiles/{id}/activate', method: post }
      - http: { path: '/admin/profiles/{id}/deactivate', method: post }

  config:
    handler: src/config/index.handler
    role: ConfigFunctionRole
    environment:
      DB_SECRET_ARN: ${param:apiDbSecretArn}
      ORIGIN_SECRET_ARN: ${param:originSecretArn}
    events:
      - http: { path: /config/settings, method: get }
      - http: { path: /config/settings, method: put }
      - http: { path: /config/settings/logo/upload-url, method: post }
      - http: { path: /config/settings/logo, method: put }
      - http: { path: /config/menus, method: get }
      - http: { path: /config/menus, method: post }
      - http: { path: '/config/menus/{id}', method: patch }
      - http: { path: '/config/menus/{id}/actions', method: put }
      - http: { path: /config/menus/reorder, method: post }
      - http: { path: /config/actions, method: get }
      - http: { path: /config/actions, method: post }
      - http: { path: '/config/actions/{id}', method: patch }
      - http: { path: /config/security-policy, method: get }
      - http: { path: /config/security-policy, method: put }
      - http: { path: /config/email-templates, method: get }
      - http: { path: '/config/email-templates/{id}', method: get }
      - http: { path: '/config/email-templates/{id}', method: put }
      - http: { path: /config/email-templates/preview, method: post }
      - http: { path: /audit/events, method: get }
      - http: { path: /audit/events/export, method: get }
      - http: { path: '/audit/events/{id}', method: get }
      - http: { path: /audit/event-types, method: get }
      - http: { path: /audit/integrity, method: get }

  saphi:
    handler: src/saphi/index.handler
    role: SaphiFunctionRole
    environment:
      DB_SECRET_ARN: ${param:apiDbSecretArn}
      ORIGIN_SECRET_ARN: ${param:originSecretArn}
    events:
      - http: { path: /saphi/companies, method: get }
      - http: { path: /saphi/companies, method: post }
      - http: { path: '/saphi/companies/{companyId}', method: get }
      - http: { path: '/saphi/companies/{companyId}', method: patch }
      - http: { path: '/saphi/companies/{companyId}/capabilities', method: get }
      - http: { path: '/saphi/companies/{companyId}/memberships', method: get }
      - http: { path: '/saphi/companies/{companyId}/memberships/{userId}', method: put }
      - http: { path: '/saphi/companies/{companyId}/memberships/{userId}/permissions', method: put }
      - http: { path: '/saphi/companies/{companyId}/farms', method: get }
      - http: { path: '/saphi/companies/{companyId}/farms', method: post }
      - http: { path: '/saphi/companies/{companyId}/farms/{id}', method: get }
      - http: { path: '/saphi/companies/{companyId}/farms/{id}', method: patch }
      - http: { path: '/saphi/companies/{companyId}/plots', method: get }
      - http: { path: '/saphi/companies/{companyId}/plots', method: post }
      - http: { path: '/saphi/companies/{companyId}/plots/{id}', method: get }
      - http: { path: '/saphi/companies/{companyId}/plots/{id}', method: patch }
      - http: { path: '/saphi/companies/{companyId}/sampling-points', method: get }
      - http: { path: '/saphi/companies/{companyId}/sampling-points', method: post }
      - http: { path: '/saphi/companies/{companyId}/sampling-points/{id}', method: get }
      - http: { path: '/saphi/companies/{companyId}/sampling-points/{id}', method: patch }
      - http: { path: '/saphi/companies/{companyId}/samples', method: get }
      - http: { path: '/saphi/companies/{companyId}/samples', method: post }
      - http: { path: '/saphi/companies/{companyId}/samples/{id}', method: get }
      - http: { path: '/saphi/companies/{companyId}/devices', method: get }
      - http: { path: '/saphi/companies/{companyId}/devices', method: post }
      - http: { path: '/saphi/companies/{companyId}/devices/{id}', method: get }
      - http: { path: '/saphi/companies/{companyId}/devices/{id}', method: patch }
      - http: { path: '/saphi/companies/{companyId}/telemetry/readings', method: get }
      - http: { path: '/saphi/companies/{companyId}/telemetry/latest', method: get }
        - http: { path: '/saphi/companies/{companyId}/dashboard', method: get }
        - http: { path: '/saphi/companies/{companyId}/satellite/map', method: get }
        - http: { path: '/saphi/companies/{companyId}/satellite/observations', method: get }
      - http: { path: '/saphi/companies/{companyId}/satellite/observations/{id}', method: get }
      - http: { path: '/saphi/companies/{companyId}/satellite/observations/{id}/assets/{assetId}/download', method: get }

  preSignUp:
    handler: src/triggers/index.preSignUpHandler
    role: PreSignUpFunctionRole
    environment:
      DB_SECRET_ARN: ${param:authDbSecretArn}

  preAuthentication:
    handler: src/triggers/index.preAuthenticationHandler
    role: PreAuthenticationFunctionRole
    environment:
      DB_SECRET_ARN: ${param:authDbSecretArn}

  postAuthentication:
    handler: src/triggers/index.postAuthenticationHandler
    role: PostAuthenticationFunctionRole
    environment:
      DB_SECRET_ARN: ${param:authDbSecretArn}

  customMessage:
    handler: src/triggers/index.customMessageHandler
    role: CustomMessageFunctionRole
    environment:
      DB_SECRET_ARN: ${param:authDbSecretArn}

resources:
  Conditions:
    EnableGoogle: !Equals ['${param:googleEnabled}', 'true']
    EnableFacebook: !Equals ['${param:facebookEnabled}', 'true']
    EnableApple: !Equals ['${param:appleEnabled}', 'true']
    # The web client needs at least one provider for its OAuth configuration.
    NoFederated: !Not [!Or [!Condition EnableGoogle, !Condition EnableFacebook, !Condition EnableApple]]

  Resources:
    # ------------------------------------------------------------------------------------------
    # Cognito: authentication only. Users, roles and permissions live in PostgreSQL.
    # ------------------------------------------------------------------------------------------
    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${sls:stage}
        DeletionProtection: ${param:deletionProtection}
        UsernameAttributes: [email]
        UsernameConfiguration: { CaseSensitive: false }
        AutoVerifiedAttributes: [email]
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: true
        AccountRecoverySetting:
          RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
        # Fixed floor. The configurable policy (app.security_policy) is enforced by the backend on every
        # password it sets; Cognito must never reject a password that policy accepts (see spec 04).
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireUppercase: false
            RequireLowercase: false
            RequireNumbers: false
            RequireSymbols: false
            TemporaryPasswordValidityDays: 3
        MfaConfiguration: 'OPTIONAL'
        EnabledMfas: [SOFTWARE_TOKEN_MFA]
        EmailConfiguration:
          EmailSendingAccount: DEVELOPER
          From: ${param:emailFrom}
          SourceArn: ${param:sesIdentityArn}
        LambdaConfig:
          PreSignUp: !GetAtt PreSignUpLambdaFunction.Arn
          PreAuthentication: !GetAtt PreAuthenticationLambdaFunction.Arn
          PostAuthentication: !GetAtt PostAuthenticationLambdaFunction.Arn
          CustomMessage: !GetAtt CustomMessageLambdaFunction.Arn

    UserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        UserPoolId: !Ref UserPool
        Domain: ${param:cognitoDomainPrefix}
        ManagedLoginVersion: 1

    GoogleIdentityProvider:
      Type: AWS::Cognito::UserPoolIdentityProvider
      Condition: EnableGoogle
      Properties:
        UserPoolId: !Ref UserPool
        ProviderName: Google
        ProviderType: Google
        ProviderDetails:
          client_id: '{{resolve:secretsmanager:${param:idpSecretName}:SecretString:googleClientId}}'
          client_secret: '{{resolve:secretsmanager:${param:idpSecretName}:SecretString:googleClientSecret}}'
          authorize_scopes: openid email profile
        AttributeMapping:
          email: email
          email_verified: email_verified
          given_name: given_name
          family_name: family_name

    FacebookIdentityProvider:
      Type: AWS::Cognito::UserPoolIdentityProvider
      Condition: EnableFacebook
      Properties:
        UserPoolId: !Ref UserPool
        ProviderName: Facebook
        ProviderType: Facebook
        ProviderDetails:
          client_id: '{{resolve:secretsmanager:${param:idpSecretName}:SecretString:facebookAppId}}'
          client_secret: '{{resolve:secretsmanager:${param:idpSecretName}:SecretString:facebookAppSecret}}'
          authorize_scopes: public_profile,email
        AttributeMapping:
          email: email
          given_name: first_name
          family_name: last_name

    AppleIdentityProvider:
      Type: AWS::Cognito::UserPoolIdentityProvider
      Condition: EnableApple
      Properties:
        UserPoolId: !Ref UserPool
        ProviderName: SignInWithApple
        ProviderType: SignInWithApple
        ProviderDetails:
          client_id: '{{resolve:secretsmanager:${param:idpSecretName}:SecretString:appleServicesId}}'
          team_id: '{{resolve:secretsmanager:${param:idpSecretName}:SecretString:appleTeamId}}'
          key_id: '{{resolve:secretsmanager:${param:idpSecretName}:SecretString:appleKeyId}}'
          private_key: '{{resolve:secretsmanager:${param:idpSecretName}:SecretString:applePrivateKey}}'
          authorize_scopes: email name
        AttributeMapping:
          email: email
          email_verified: email_verified
          given_name: firstName
          family_name: lastName

    # Providers are referenced with !Ref (returns the provider name) so the client waits for them.
    # Confidential client used only by our backend (BFF): the browser never sees Cognito tokens
    # except the short-lived access token.
    WebClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref UserPool
        ClientName: web
        GenerateSecret: true
        ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows: [code]
        AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
        CallbackURLs: ['https://${param:webDomain}/api/auth/federated/callback']
        LogoutURLs: ['https://${param:webDomain}/login']
        SupportedIdentityProviders:
          - !If [NoFederated, COGNITO, !Ref AWS::NoValue]
          - !If [EnableGoogle, !Ref GoogleIdentityProvider, !Ref AWS::NoValue]
          - !If [EnableFacebook, !Ref FacebookIdentityProvider, !Ref AWS::NoValue]
          - !If [EnableApple, !Ref AppleIdentityProvider, !Ref AWS::NoValue]
        AccessTokenValidity: 10
        IdTokenValidity: 10
        # Maximum allowed by the policy; app.authenticate() enforces the configured session length and idle time.
        RefreshTokenValidity: 720
        TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: hours }
        AuthSessionValidity: 3
        EnableTokenRevocation: true
        PreventUserExistenceErrors: ENABLED

    # Public client for the Flutter app: system browser + authorization code with PKCE.
    MobileClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref UserPool
        ClientName: mobile
        GenerateSecret: false
        ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows: [code]
        AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
        CallbackURLs: ['${param:mobileRedirectUri}']
        LogoutURLs: ['${param:mobileRedirectUri}']
        SupportedIdentityProviders:
          - COGNITO
          - !If [EnableGoogle, !Ref GoogleIdentityProvider, !Ref AWS::NoValue]
          - !If [EnableFacebook, !Ref FacebookIdentityProvider, !Ref AWS::NoValue]
          - !If [EnableApple, !Ref AppleIdentityProvider, !Ref AWS::NoValue]
        AccessTokenValidity: 10
        IdTokenValidity: 10
        # Maximum allowed by the policy; app.authenticate() enforces the configured session length and idle time.
        RefreshTokenValidity: 720
        TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: hours }
        AuthSessionValidity: 3
        EnableTokenRevocation: true
        PreventUserExistenceErrors: ENABLED

    PreSignUpInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt PreSignUpLambdaFunction.Arn
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt UserPool.Arn
    PreAuthenticationInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt PreAuthenticationLambdaFunction.Arn
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt UserPool.Arn
    PostAuthenticationInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt PostAuthenticationLambdaFunction.Arn
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt UserPool.Arn
    CustomMessageInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt CustomMessageLambdaFunction.Arn
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt UserPool.Arn

    # ------------------------------------------------------------------------------------------
    # AWS WAF on the Cognito User Pool (protects the hosted login used by the mobile app).
    # The web and the API are protected by WebAcl on CloudFront.
    # ------------------------------------------------------------------------------------------
    CognitoWebAcl:
      Type: AWS::WAFv2::WebACL
      Properties:
        Name: ${self:service}-${sls:stage}-cognito
        Scope: REGIONAL
        DefaultAction: { Allow: {} }
        VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: cognito-acl }
        Rules:
          - Name: common
            Priority: 1
            OverrideAction: { None: {} }
            Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesCommonRuleSet } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common }
          - Name: known-bad-inputs
            Priority: 2
            OverrideAction: { None: {} }
            Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: known-bad-inputs }
          - Name: ip-reputation
            Priority: 3
            OverrideAction: { None: {} }
            Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation }
          - Name: rate-limit-ip
            Priority: 4
            Action: { Block: {} }
            Statement: { RateBasedStatement: { Limit: 300, EvaluationWindowSec: 300, AggregateKeyType: IP } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit-ip }

    CognitoWebAclAssociation:
      Type: AWS::WAFv2::WebACLAssociation
      Properties:
        ResourceArn: !GetAtt UserPool.Arn
        WebACLArn: !GetAtt CognitoWebAcl.Arn

    # ------------------------------------------------------------------------------------------
    # Private photo bucket (presigned POST/GET only)
    # ------------------------------------------------------------------------------------------
    PhotoBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketEncryption:
          ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins: ['https://${param:webDomain}']
              AllowedMethods: [GET, POST]
              AllowedHeaders: ['*']
              MaxAge: 3000

    PhotoBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref PhotoBucket
        PolicyDocument:
          Statement:
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource: [!GetAtt PhotoBucket.Arn, !Join ['', [!GetAtt PhotoBucket.Arn, '/*']]]
              Condition: { Bool: { 'aws:SecureTransport': 'false' } }

    # ------------------------------------------------------------------------------------------
    # One least-privilege IAM role per Lambda
    # ------------------------------------------------------------------------------------------
    AuthFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: &lambdaTrust
          Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
        Policies:
          - PolicyName: auth
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-auth:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: ['${param:authDbSecretArn}', '${param:appSecretArn}', '${param:originSecretArn}']
                - Effect: Allow
                  Action: ses:SendEmail
                  Resource: '${param:sesIdentityArn}'
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Join ['', [!GetAtt PhotoBucket.Arn, '/branding/*']]

    AuthFunctionCognitoPolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: auth-cognito
        Roles: [!Ref AuthFunctionRole]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:DescribeUserPoolClient
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminUserGlobalSignOut
              Resource: !GetAtt UserPool.Arn

    MeFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: me
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-me:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: ['${param:apiDbSecretArn}', '${param:originSecretArn}']
                - Effect: Allow
                  Action: [s3:PutObject, s3:GetObject]
                  Resource: !Join ['', [!GetAtt PhotoBucket.Arn, '/users/*']]
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Join ['', [!GetAtt PhotoBucket.Arn, '/branding/*']]

    SaphiFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: saphi
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-saphi:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: ['${param:apiDbSecretArn}', '${param:originSecretArn}']

    ConfigFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: config
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-config:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: ['${param:apiDbSecretArn}', '${param:originSecretArn}']
                - Effect: Allow
                  Action: [s3:PutObject, s3:GetObject]
                  Resource: !Join ['', [!GetAtt PhotoBucket.Arn, '/branding/*']]

    AdminFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: admin
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-admin:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: ['${param:apiDbSecretArn}', '${param:originSecretArn}']
                - Effect: Allow
                  Action: ses:SendEmail
                  Resource: '${param:sesIdentityArn}'

    AdminFunctionCognitoPolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: admin-cognito
        Roles: [!Ref AdminFunctionRole]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminResetUserPassword
                - cognito-idp:AdminUserGlobalSignOut
              Resource: !GetAtt UserPool.Arn

    PreSignUpFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: pre-sign-up
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-preSignUp:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: '${param:authDbSecretArn}'

    # Separate policy: the pool depends on the trigger function, so the role cannot reference the pool.
    PreSignUpCognitoPolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: pre-sign-up-cognito
        Roles: [!Ref PreSignUpFunctionRole]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminDeleteUser, cognito-idp:AdminLinkProviderForUser]
              Resource: !GetAtt UserPool.Arn

    PreAuthenticationFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: pre-authentication
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-preAuthentication:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: '${param:authDbSecretArn}'
                - Effect: Allow
                  Action: ses:SendEmail
                  Resource: '${param:sesIdentityArn}'

    PostAuthenticationFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: post-authentication
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-postAuthentication:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: '${param:authDbSecretArn}'

    CustomMessageFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrust
        Policies:
          - PolicyName: custom-message
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-customMessage:*
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: '${param:authDbSecretArn}'

    # ------------------------------------------------------------------------------------------
    # Web: private S3 bucket behind CloudFront (OAC). CloudFront also routes /api/* to API Gateway,
    # adding the secret X-Origin-Verify header the Lambdas require, so the web and the API share
    # one origin and execute-api cannot be called directly.
    # ------------------------------------------------------------------------------------------
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketEncryption:
          ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

    WebOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${sls:stage}-web
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Statement:
            - Sid: CloudFrontRead
              Effect: Allow
              Principal: { Service: cloudfront.amazonaws.com }
              Action: s3:GetObject
              Resource: !Join ['', [!GetAtt WebBucket.Arn, '/*']]
              Condition:
                StringEquals:
                  AWS:SourceArn: !Join ['', ['arn:aws:cloudfront::', !Ref AWS::AccountId, ':distribution/', !Ref WebDistribution]]
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource: [!GetAtt WebBucket.Arn, !Join ['', [!GetAtt WebBucket.Arn, '/*']]]
              Condition: { Bool: { 'aws:SecureTransport': 'false' } }

    # SPA routing: paths without a file extension serve index.html.
    SpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${sls:stage}-spa
        AutoPublish: true
        FunctionConfig: { Comment: SPA routing, Runtime: cloudfront-js-2.0 }
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            if (!/\.[a-zA-Z0-9]+$/.test(request.uri)) request.uri = '/index.html';
            return request;
          }

    SecurityHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${sls:stage}-security
          SecurityHeadersConfig:
            StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Preload: true, Override: true }
            ContentTypeOptions: { Override: true }
            FrameOptions: { FrameOption: DENY, Override: true }
            ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
            ContentSecurityPolicy:
              Override: true
              ContentSecurityPolicy: !Join
                - ''
                - - "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; "
                  - "style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://"
                  - !GetAtt PhotoBucket.RegionalDomainName
                  - "; connect-src 'self' https://"
                  - !GetAtt PhotoBucket.RegionalDomainName
                  - "; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
          CustomHeadersConfig:
            Items:
              - { Header: Permissions-Policy, Value: 'camera=(), microphone=(), geolocation=(), payment=()', Override: true }
              - { Header: Cross-Origin-Opener-Policy, Value: same-origin, Override: true }

    # /api/*: never cached; Authorization is part of the (zero-TTL) cache key so it reaches the origin.
    ApiCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: ${self:service}-${sls:stage}-api
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 1
          ParametersInCacheKeyAndForwardedToOrigin:
            EnableAcceptEncodingGzip: false
            HeadersConfig: { HeaderBehavior: whitelist, Headers: [Authorization] }
            CookiesConfig: { CookieBehavior: none }
            QueryStringsConfig: { QueryStringBehavior: none }

    ApiOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Properties:
        OriginRequestPolicyConfig:
          Name: ${self:service}-${sls:stage}-api
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Origin, Content-Type, Accept, User-Agent, X-CSRF-Token, CloudFront-Viewer-Address]
          CookiesConfig: { CookieBehavior: all }
          QueryStringsConfig: { QueryStringBehavior: all }

    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Aliases: ['${param:webDomain}']
          ViewerCertificate: { AcmCertificateArn: '${param:certificateArn}', SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          HttpVersion: http2and3
          DefaultRootObject: index.html
          WebACLId: !GetAtt WebAcl.Arn
          Origins:
            - Id: web
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
              S3OriginConfig: { OriginAccessIdentity: '' }
            - Id: api
              DomainName: !Join ['', [!Ref ApiGatewayRestApi, '.execute-api.', !Ref AWS::Region, '.amazonaws.com']]
              OriginPath: /${sls:stage}
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
              OriginCustomHeaders:
                - HeaderName: X-Origin-Verify
                  HeaderValue: '{{resolve:secretsmanager:${param:originSecretArn}:SecretString:value}}'
          DefaultCacheBehavior:
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN }]
          CacheBehaviors:
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachePolicyId: !Ref ApiCachePolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
              ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

    # Global WAF for the web and the API (scope CLOUDFRONT requires us-east-1).
    WebAcl:
      Type: AWS::WAFv2::WebACL
      Properties:
        Name: ${self:service}-${sls:stage}-web
        Scope: CLOUDFRONT
        DefaultAction: { Allow: {} }
        VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: web-acl }
        Rules:
          - Name: common
            Priority: 1
            OverrideAction: { None: {} }
            Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesCommonRuleSet } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: web-common }
          - Name: known-bad-inputs
            Priority: 2
            OverrideAction: { None: {} }
            Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: web-known-bad-inputs }
          - Name: sqli
            Priority: 3
            OverrideAction: { None: {} }
            Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: web-sqli }
          - Name: ip-reputation
            Priority: 4
            OverrideAction: { None: {} }
            Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: web-ip-reputation }
          - Name: rate-limit-auth
            Priority: 5
            Action: { Block: {} }
            Statement:
              RateBasedStatement:
                Limit: 100
                EvaluationWindowSec: 300
                AggregateKeyType: IP
                ScopeDownStatement:
                  ByteMatchStatement:
                    FieldToMatch: { UriPath: {} }
                    PositionalConstraint: STARTS_WITH
                    SearchString: /api/auth/
                    TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: web-rate-auth }
          - Name: rate-limit-ip
            Priority: 6
            Action: { Block: {} }
            Statement: { RateBasedStatement: { Limit: 2000, EvaluationWindowSec: 300, AggregateKeyType: IP } }
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: web-rate-ip }

  Outputs:
    UserPoolId: { Value: !Ref UserPool }
    WebClientId: { Value: !Ref WebClient }
    MobileClientId: { Value: !Ref MobileClient }
    CognitoDomain: { Value: 'https://${param:cognitoDomainPrefix}.auth.${aws:region}.amazoncognito.com' }
    PhotoBucketName: { Value: !Ref PhotoBucket }
    WebBucketName: { Value: !Ref WebBucket }
    WebDistributionId: { Value: !Ref WebDistribution }
    WebDistributionDomain: { Value: !GetAtt WebDistribution.DomainName }
